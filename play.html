<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="icon" href="data:,"><title>Kiki / play</title>
<style>:root{--paper:#111b1a;--ink:#ecf0df;--accent:#e4865e}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font:14px monospace}header{position:fixed;z-index:2;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;pointer-events:none}header a,button{pointer-events:auto;color:inherit;background:#1d2c29;border:1px solid #52635c;padding:9px 12px;font:inherit;text-decoration:none}#title{letter-spacing:2px;text-transform:uppercase}#hud{position:fixed;z-index:2;top:65px;left:22px;max-width:min(560px,calc(100vw - 44px));white-space:pre-line;line-height:1.35;color:#b9c8bb}.controls{position:fixed;z-index:3;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:12px;align-items:end}.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:4px}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.control-button{height:88px;min-width:76px;color:#fff;background:#a95643;border:0}.won{background:#6b9f7b!important}@media(max-width:600px){header{padding:12px}.controls{bottom:10px}.pad{grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,38px)}}
</style></head><body><header><a href="index.html">KIKI</a><span id="title"></span><button id="reset">reset</button></header><div id="hud"></div><div class="controls"><div class="pad"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><button class="control-button" id="jump">JUMP<br>+ MOVE</button><button class="control-button" id="push">PUSH</button><button class="control-button" id="shoot">SHOOT</button></div>
<script src="kiki/js/kiki.js"></script><script type="module">
import * as THREE from './kiki/js/threejs/three.module.js';
const query = new URLSearchParams(location.search);
const game = new Kiki.Game(Kiki.getLevel(query.get('level')));
const scene = new THREE.Scene();
scene.background = new THREE.Color('#111b1a');
const camera = new THREE.OrthographicCamera(-10, 10, 7, -7, .1, 100);
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe6f0d9, 0x24312c, 2));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(-3, 8, 5);
scene.add(keyLight);
const board = new THREE.Group();
scene.add(board);
const palette = {mint: 0x91c1a7, copper: 0xd78363, sky: 0x80aeba, violet: 0xb295c9, lime: 0xb8c76e, coral: 0xe4865e};
function cube(size, color){return new THREE.Mesh(new THREE.BoxGeometry(size, size, size), new THREE.MeshStandardMaterial({color, roughness: .8}));}
function worldPoint(level, position, lift){
  return {
    x: position.x - level.size.x / 2 + .5,
    y: (position.y || 0) + (lift || 0),
    z: (position.z || 0) - level.size.z / 2 + .5
  };
}
function addCube(position, size, color){
  const mesh = cube(size, color);
  mesh.position.set(position.x, position.y, position.z);
  board.add(mesh);
  return mesh;
}
function draw(){
  while(board.children.length) board.remove(board.children[0]);
  const level = game.level;
  for(let z = 0; z < level.size.z; z += 1) {
    for(let x = 0; x < level.size.x; x += 1) {
      addCube(worldPoint(level, {x, y: 0, z}, -.55), .96, (x + z) % 2 ? 0x20332f : 0x263b35);
    }
  }
  (level.walls || []).forEach(wall => addCube(worldPoint(level, wall, 0), .88, 0x657a6d));
  (level.exits || [{active: true, coordinates: level.exit}]).forEach(exit => {
    if (exit.active === false) return;
    addCube(worldPoint(level, exit.coordinates || exit, .15), .72, palette[level.theme] || 0x91c1a7);
  });
  addCube(worldPoint(level, game.position, .35), .58, 0xf3c56c);
  const span = Math.max(level.size.x, level.size.z, level.size.y + 3);
  camera.left = -span / 2 - 1;
  camera.right = span / 2 + 1;
  camera.top = span / 2 + 1;
  camera.bottom = -span / 2 - 1;
  camera.position.set(0, Math.max(9, level.size.y + 6), Math.max(8, level.size.z));
  camera.lookAt(0, Math.max(1, level.size.y / 3), 0);
  camera.updateProjectionMatrix();
  document.getElementById('title').textContent = String(level.index + 1).padStart(2, '0') + ' / ' + level.title;
  document.getElementById('hud').textContent = game.won ? 'EXIT REACHED' : 'MOVES ' + game.moves + '  ·  ' + game.help;
  document.querySelectorAll('.control-button').forEach(button => button.classList.toggle('won', game.won));
  renderer.render(scene, camera);
}
function act(direction){if(game.action(direction)) draw();}
document.querySelectorAll('[data-dir]').forEach(button => button.addEventListener('click', () => act(button.dataset.dir)));
document.getElementById('reset').onclick = () => { location.reload(); };
document.getElementById('jump').onclick = () => act('jump');
document.getElementById('push').onclick = () => {};
document.getElementById('shoot').onclick = () => {};
addEventListener('keydown', event => {
  const map = {ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down', ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', Control: 'jump', j: 'jump'};
  if(map[event.key]){event.preventDefault();act(map[event.key]);}
});
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); draw(); });
draw();
</script></body></html>
