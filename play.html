<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="icon" href="data:,"><title>Kiki / play</title>
<style>:root{--paper:#111b1a;--ink:#ecf0df;--accent:#e4865e}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font:14px monospace}header{position:fixed;z-index:2;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;pointer-events:none}header a,button{pointer-events:auto;color:inherit;background:#1d2c29;border:1px solid #52635c;padding:9px 12px;font:inherit;text-decoration:none}#title{letter-spacing:2px;text-transform:uppercase}#hud{position:fixed;z-index:2;top:65px;left:22px;max-width:min(560px,calc(100vw - 44px));white-space:pre-line;line-height:1.35;color:#b9c8bb}.controls{position:fixed;z-index:3;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:12px;align-items:end}.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:4px}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.control-button{height:88px;min-width:76px;color:#fff;background:#a95643;border:0}.won{background:#6b9f7b!important}@media(max-width:600px){header{padding:12px}.controls{bottom:10px}.pad{grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,38px)}}
</style></head><body><header><a href="index.html">KIKI</a><span id="title"></span><button id="reset">reset</button></header><div id="hud"></div><div class="controls"><div class="pad"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><button class="control-button" id="jump">JUMP<br>+ MOVE</button><button class="control-button" id="push">PUSH</button><button class="control-button" id="shoot">SHOOT</button></div>
<script src="kiki/js/kiki.js"></script><script src="kiki/js/kiki_meshes.js"></script><script type="module">
import * as THREE from './kiki/js/threejs/three.module.js';
const query = new URLSearchParams(location.search);
const game = new Kiki.Game(Kiki.getLevel(query.get('level')));
const scene = new THREE.Scene();
scene.background = new THREE.Color('#111b1a');
const camera = new THREE.PerspectiveCamera(90, innerWidth / innerHeight, .1, 120);
let cameraMode = 'behind';
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe6f0d9, 0x24312c, 1.7));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(-3, 8, 5);
scene.add(keyLight);
const board = new THREE.Group();
scene.add(board);
const palette = {mint: 0x91c1a7, copper: 0xd78363, sky: 0x80aeba, violet: 0xb295c9, lime: 0xb8c76e, coral: 0xe4865e};
const materials = {
  floorA: new THREE.MeshStandardMaterial({color: 0x20332f, roughness: .85}),
  floorB: new THREE.MeshStandardMaterial({color: 0x263b35, roughness: .85}),
  wall: new THREE.MeshStandardMaterial({color: 0x66796d, roughness: .82}),
  botBody: new THREE.MeshStandardMaterial({color: 0xf3c56c, roughness: .62, metalness: .05}),
  botTire: new THREE.MeshStandardMaterial({color: 0x1b2422, roughness: .88}),
  room: new THREE.MeshStandardMaterial({color: 0x71907f, roughness: .9, transparent: true, opacity: .11, side: THREE.BackSide}),
  roomLine: new THREE.LineBasicMaterial({color: 0x465c53, transparent: true, opacity: .55})
};
function cube(size, material){return new THREE.Mesh(new THREE.BoxGeometry(size, size, size), material);}
function v(position){return new THREE.Vector3(position.x, position.y, position.z);}
function centered(level, position, lift){
  return new THREE.Vector3(
    position.x - level.size.x / 2 + .5,
    (position.y || 0) - level.size.y / 2 + .5 + (lift || 0),
    (position.z || 0) - level.size.z / 2 + .5
  );
}
function addCube(position, size, material){
  const mesh = cube(size, material);
  mesh.position.copy(position);
  board.add(mesh);
  return mesh;
}
function addRoom(level){
  const room = new THREE.Mesh(new THREE.BoxGeometry(level.size.x, level.size.y, level.size.z), materials.room);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(room.geometry), materials.roomLine);
  board.add(room, edges);
}
function addGate(level, exit){
  const color = palette[level.theme] || 0x91c1a7;
  const material = new THREE.MeshStandardMaterial({color, emissive: color, emissiveIntensity: .28, roughness: .45});
  const group = new THREE.Group();
  const ringA = new THREE.Mesh(new THREE.TorusGeometry(.33, .035, 8, 32), material);
  const ringB = ringA.clone();
  const core = new THREE.Mesh(new THREE.SphereGeometry(.16, 16, 12), material);
  ringB.rotation.x = Math.PI / 2;
  group.add(ringA, ringB, core);
  group.position.copy(centered(level, exit.coordinates || exit, 0));
  board.add(group);
}
function addBot(level){
  const bot = KikiMeshes.createBot(THREE, {body: materials.botBody, tire: materials.botTire});
  const right = game.getRight();
  const basis = new THREE.Matrix4().makeBasis(v(right), v(game.up), v(game.dir));
  basis.setPosition(centered(level, game.position, 0));
  bot.matrix.copy(basis);
  bot.matrixAutoUpdate = false;
  board.add(bot);
}
function updateCamera(level){
  const position = centered(level, game.position, 0);
  const dir = v(game.dir).normalize();
  const up = v(game.up).normalize();
  camera.aspect = innerWidth / innerHeight;
  camera.up.copy(up);
  if (cameraMode === 'inside') {
    camera.position.copy(position).addScaledVector(up, .18);
    camera.lookAt(position.clone().add(dir));
  } else {
    const desired = cameraMode === 'follow'
      ? position.clone().addScaledVector(up, 2.2).addScaledVector(dir, -4.2)
      : position.clone().add(up.clone().addScaledVector(dir, -2).normalize().multiplyScalar(3.1));
    camera.position.copy(desired);
    camera.lookAt(position.clone().addScaledVector(dir, .35));
  }
  camera.updateProjectionMatrix();
}
function draw(){
  while(board.children.length) board.remove(board.children[0]);
  const level = game.level;
  addRoom(level);
  for(let z = 0; z < level.size.z; z += 1) {
    for(let x = 0; x < level.size.x; x += 1) {
      addCube(centered(level, {x, y: 0, z}, -.55), .96, (x + z) % 2 ? materials.floorA : materials.floorB);
    }
  }
  (level.walls || []).forEach(wall => addCube(centered(level, wall, 0), .88, materials.wall));
  (level.exits || [{active: true, coordinates: level.exit}]).forEach(exit => {
    if (exit.active === false) return;
    addGate(level, exit);
  });
  addBot(level);
  updateCamera(level);
  document.getElementById('title').textContent = String(level.index + 1).padStart(2, '0') + ' / ' + level.title;
  document.getElementById('hud').textContent = game.won ? 'EXIT REACHED' : 'MOVES ' + game.moves + '  ·  ' + cameraMode.toUpperCase() + '\n' + game.help;
  document.querySelectorAll('.control-button').forEach(button => button.classList.toggle('won', game.won));
  renderer.render(scene, camera);
}
function act(direction){if(game.action(direction)) draw();}
document.querySelectorAll('[data-dir]').forEach(button => button.addEventListener('click', () => act(button.dataset.dir)));
document.getElementById('reset').onclick = () => { location.reload(); };
document.getElementById('jump').onclick = () => act('jump forward');
document.getElementById('push').onclick = () => {};
document.getElementById('shoot').onclick = () => {};
addEventListener('keydown', event => {
  const map = {ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down', ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', Control: 'jump forward', j: 'jump', ' ': 'jump forward'};
  if(event.key === 'v'){event.preventDefault();cameraMode = cameraMode === 'behind' ? 'follow' : cameraMode === 'follow' ? 'inside' : 'behind';draw();return;}
  if(map[event.key]){event.preventDefault();act(map[event.key]);}
});
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); draw(); });
draw();
</script></body></html>
