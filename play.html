<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="icon" href="data:,">
  <title>Kiki / play</title>
  <style>
    :root {
      --paper: #212121;
      --ink: #e0e0c0;
      --accent: #ff8000
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      background: var(--paper);
      color: var(--ink);
      font: 14px monospace
    }

    body {
      position: fixed;
      inset: 0
    }

    canvas {
      display: block;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none
    }

	    button,
	    a,
	    label,
	    input {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
	      -webkit-touch-callout: none
	    }

	    [hidden] {
	      display: none !important
	    }

	    header {
	      position: fixed;
	      z-index: 2;
	      top: 0;
	      left: 0;
	      right: 0;
	      padding: 18px 22px;
	      display: grid;
	      grid-template-columns: auto minmax(0, 1fr) auto;
	      gap: 12px;
	      align-items: start;
	      pointer-events: none
	    }
	
	    .header-brand {
	      display: flex;
	      gap: 8px;
	      align-items: center
	    }

	    .level-nav-row {
	      justify-self: center;
	      display: grid;
	      grid-template-columns: 42px minmax(0, auto) 42px;
	      gap: 8px;
	      align-items: center;
	      min-width: 0
	    }

	    .level-title {
	      display: flex;
	      gap: 8px;
	      align-items: center;
	      justify-content: center;
	      min-width: 0
	    }

	    .port-status {
	      flex: 0 0 auto;
	      width: 1.4em;
	      text-align: center;
	      font-weight: bold
	    }

	    .port-status-ported {
	      color: #96e0a5
	    }

	    .port-status-in_progress {
	      color: #f0bf66
	    }

	    .port-status-not_started {
	      color: #9a9a8a
	    }

	    .header-actions {
	      display: flex;
	      flex-direction: column;
	      gap: 8px;
	      align-items: flex-end
	    }

	    .local-tools {
	      display: flex;
	      flex-direction: column;
	      gap: 8px;
	      align-items: flex-end
	    }
	
	    header a,
	    header button,
	    header label {
	      pointer-events: auto;
	      color: inherit;
	      background: #2b2b2b;
	      border: 1px solid #707070;
	      padding: 9px 12px;
	      font: inherit;
	      text-decoration: none
	    }
	
	    header button:disabled {
	      opacity: .35;
	      pointer-events: none
	    }
	
	    .debug-toggle {
	      display: flex;
	      gap: 7px;
	      align-items: center;
	      color: #c8c8a8;
	      background: rgba(43, 43, 43, .78);
	      border: 1px solid rgba(112, 112, 112, .8);
	      padding: 7px 9px;
	      font: 12px monospace;
	      text-transform: uppercase;
	      pointer-events: auto;
	      width: 100%;
	      justify-content: flex-end
	    }

    .debug-toggle input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--accent)
    }

	    #title {
	      letter-spacing: 2px;
	      text-transform: uppercase;
	      overflow: hidden;
	      text-align: center;
	      text-overflow: ellipsis;
	      white-space: nowrap
	    }

    #hud {
      position: fixed;
      z-index: 2;
      top: 65px;
      left: 22px;
      max-width: min(560px, calc(100vw - 44px));
      white-space: pre-line;
      line-height: 1.35;
      color: #c8c8a8
    }

    .controls {
      position: fixed;
      z-index: 3;
      bottom: calc(16px + env(safe-area-inset-bottom));
      left: 50%;
      width: min(100vw - 24px, 560px);
      display: grid;
      grid-template-columns: minmax(72px, 96px) minmax(148px, 220px) minmax(72px, 96px);
      gap: 14px;
      align-items: end;
      justify-content: center;
      transform: translateX(-50%);
      touch-action: none
    }

    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .jump-actions {
      gap: 0
    }

    .control-button,
    .touchpad {
      color: #fff;
      background: transparent;
      font: inherit;
      text-decoration: none
    }

    .control-button {
      min-height: 46px;
      min-width: 72px;
      padding: 8px 10px;
      border: 1px solid rgba(224, 224, 192, .72);
      border-radius: 6px;
      line-height: 1.1
    }

    .jump-actions .control-button {
      border-radius: 0
    }

    .jump-actions .control-button:first-child {
      border-radius: 6px 6px 0 0
    }

    .jump-actions .control-button:last-child {
      border-radius: 0 0 6px 6px
    }

    .jump-actions .control-button:not(:last-child) {
      border-bottom: 0
    }

    .touchpad {
      position: relative;
      aspect-ratio: 1/1;
      width: 100%;
      min-width: 148px;
      max-width: 220px;
      border: 0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      touch-action: none
    }

    .touchpad::before,
    .touchpad::after {
      content: "";
      position: absolute;
      background: rgba(224, 224, 192, .28)
    }

    .touchpad::before {
      left: 18%;
      right: 18%;
      top: 50%;
      height: 1px
    }

    .touchpad::after {
      top: 18%;
      bottom: 18%;
      left: 50%;
      width: 1px
    }

    .touchpad-mark {
      position: absolute;
      color: #e0e0c0;
      opacity: .88
    }

    .touchpad-mark.up {
      top: 12px
    }

    .touchpad-mark.down {
      bottom: 12px
    }

    .touchpad-mark.left {
      left: 14px
    }

    .touchpad-mark.right {
      right: 14px
    }

    .touchpad-knob {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 128, 0, .9);
      border-radius: 50%;
      transform: translate(var(--pad-x, 0), var(--pad-y, 0));
      transition: transform 80ms linear
    }

    .touchpad.active .touchpad-knob {
      transition: none
    }

    .won {
      border-color: #dede45 !important;
      color: #ffff8a !important
    }

	    @media(max-width:600px) {
	      header {
	        padding: 12px;
	        gap: 8px
	      }

	      .level-nav-row {
	        grid-template-columns: 36px minmax(0, auto) 36px;
	        gap: 6px
	      }

	      header a,
	      header button {
	        padding: 8px 9px
	      }

	      .debug-toggle {
	        padding: 7px 8px
	      }

      .controls {
        bottom: calc(10px + env(safe-area-inset-bottom));
        width: 100%;
        padding: 0 10px;
        grid-template-columns: minmax(62px, 76px) minmax(136px, 1fr) minmax(62px, 76px);
        gap: 8px
      }

      .control-button {
        min-width: 62px;
        min-height: 42px;
        padding: 7px 6px
      }

      .touchpad {
        min-width: 136px;
        max-width: 190px;
        justify-self: center
      }
    }
  </style>
</head>

<body>
	  <header>
	    <span class="header-brand"><a href="index.html">KIKI</a></span>
	    <span class="level-nav-row"><button id="level-previous" type="button" aria-label="previous level"
	        title="previous level">&lt;</button><span class="level-title"><span id="port-status"
	          class="port-status"></span><span id="title"></span></span><button id="level-next" type="button"
	        aria-label="next level" title="next level">&gt;</button></span>
	    <span class="header-actions"><button id="reset" type="button">reset</button><span class="local-tools"
	        id="local-tools" hidden><button id="screenshot" type="button" hidden>screenshot</button><label
	          class="debug-toggle"><input id="debug-path-toggle" type="checkbox">debug</label></span></span>
	  </header>
  <div id="hud"></div>
  <div class="controls">
    <div class="action-stack tool-actions"><button class="control-button" id="push">PUSH</button><button
        class="control-button" id="shoot">ENERGY</button></div>
    <div class="touchpad" id="touchpad" role="application" aria-label="movement touchpad"><span
        class="touchpad-mark up">↑</span><span class="touchpad-mark left">←</span><span
        class="touchpad-mark right">→</span><span class="touchpad-mark down">↓</span><span class="touchpad-knob"
        id="touchpad-knob"></span></div>
    <div class="action-stack jump-actions"><button class="control-button"
        data-action="jump far forward">+FAR</button><button class="control-button"
        data-action="jump forward">+FWD</button><button class="control-button" data-action="jump">JUMP</button></div>
  </div>
	  <script id="kiki-debug-trace" type="application/json"></script>
  <script src="kiki/js/kiki_static_data.js"></script>
  <script src="kiki/js/kiki.js"></script>
  <script src="kiki/js/kiki_meshes.js"></script>
  <script src="kiki/js/kiki_item_meshes.js"></script>
  <script type="module">
    import * as THREE from './kiki/js/threejs/three.module.js';
    const query = new URLSearchParams(location.search);
	    const requestedLevelIndex = Kiki.getLevelIndex(query.get('level'));
	    let game = new Kiki.Game(Kiki.getLevel(requestedLevelIndex));
	    const CONTINUE_LEVEL_KEY = 'kikiContinueLevel';
	    const isLocalDevelopment = isLocalhost();
	    function rememberLevel(index) {
      const value = String(index);
      try { localStorage.setItem(CONTINUE_LEVEL_KEY, value); } catch (error) { }
      document.cookie = CONTINUE_LEVEL_KEY + '=' + encodeURIComponent(value) + '; max-age=31536000; path=/; SameSite=Lax';
    }
    rememberLevel(game.level.index);
    const levelScheme = Kiki.getColorScheme(game.level.scheme);
    function schemeEntry(className, part) {
      return levelScheme && levelScheme[className] && levelScheme[className][part || 'base'];
    }
    function schemeColor(className, part, fallback) {
      const entry = schemeEntry(className, part);
      if (!entry) return new THREE.Color(fallback);
      return new THREE.Color(entry[0], entry[1], entry[2]);
    }
    function schemeAlpha(className, part, fallback) {
      const entry = schemeEntry(className, part);
      return entry && entry.length > 3 ? entry[3] : fallback;
    }
    function materialFromScheme(className, part, fallback, options) {
      const alpha = schemeAlpha(className, part, 1);
      const materialOptions = Object.assign({ color: schemeColor(className, part, fallback) }, options || {});
      if (alpha < 1 && materialOptions.opacity === undefined) {
        materialOptions.transparent = true;
        materialOptions.opacity = alpha;
      }
      return new THREE.MeshStandardMaterial(materialOptions);
    }
    function lineMaterialFromScheme(className, part, fallback, options) {
      const alpha = schemeAlpha(className, part, 1);
      const materialOptions = Object.assign({ color: schemeColor(className, part, fallback) }, options || {});
      if (alpha < 1 && materialOptions.opacity === undefined) {
        materialOptions.transparent = true;
        materialOptions.opacity = alpha;
      }
      return new THREE.LineBasicMaterial(materialOptions);
    }
    function dimmedMaterial(className, part, fallback, options) {
      const color = schemeColor(className, part, fallback).multiplyScalar(.36);
      return new THREE.MeshStandardMaterial(Object.assign({ color, emissive: color, emissiveIntensity: .2 }, options || {}));
    }
    document.documentElement.style.setProperty('--paper', schemeColor('KikiWorld', 'base', '#212121').getStyle());
    document.documentElement.style.setProperty('--ink', schemeColor('KikiText', 'bright', '#e0e0c0').getStyle());
    document.documentElement.style.setProperty('--accent', schemeColor('KikiGate', 'base', '#ff8000').getStyle());
    const scene = new THREE.Scene();
    scene.background = schemeColor('KikiWorld', 'base', '#212121');
    const camera = new THREE.PerspectiveCamera(90, innerWidth / innerHeight, .1, 120);
    let cameraMode = 'behind';
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    renderer.domElement.tabIndex = 0;
    renderer.domElement.focus({ preventScroll: true });
    addEventListener('pageshow', event => {
      if (event.persisted && game.won) {
        location.reload();
        return;
      }
      renderer.domElement.focus({ preventScroll: true });
    });
    renderer.domElement.addEventListener('touchmove', event => event.preventDefault(), { passive: false });
    ['gesturestart', 'gesturechange', 'gestureend', 'selectstart', 'dragstart', 'contextmenu', 'dblclick'].forEach(type => {
      addEventListener(type, event => event.preventDefault(), { passive: false });
    });
    addEventListener('touchmove', event => event.preventDefault(), { passive: false });
    scene.add(new THREE.HemisphereLight(schemeColor('KikiLight', 'diffuse', '#ffffff'), schemeColor('KikiLight', 'base', '#000000'), .25));
    const keyLight = new THREE.DirectionalLight(schemeColor('KikiLight', 'diffuse', '#ffffff'), .75);
    keyLight.position.set(-3, 6, 4);
    scene.add(keyLight);
    const cameraLight = new THREE.SpotLight(schemeColor('KikiLight', 'specular', '#ffffff'), 2.15, 0, Math.PI / 2, .16, .45);
    cameraLight.target = new THREE.Object3D();
    scene.add(cameraLight, cameraLight.target);
    const board = new THREE.Group();
    scene.add(board);
    const effects = new THREE.Group();
    scene.add(effects);
    const materials = {
      floorA: materialFromScheme('KikiWorld', 'plate', '#555555', { roughness: .55, metalness: .05 }),
      floorB: materialFromScheme('KikiWorld', 'base', '#666666', { roughness: .55, metalness: .05 }),
      wall: materialFromScheme('KikiWorld', 'base', '#808080', { roughness: .48, metalness: .04 }),
      stone: materialFromScheme('KikiStone', 'base', '#9a9a8a', { roughness: .52, metalness: .03 }),
      switchRing: materialFromScheme('KikiSwitch', 'base', '#a0b8ff', { emissive: schemeColor('KikiSwitch', 'base', '#182c64'), emissiveIntensity: .25, roughness: .34 }),
      switchCore: materialFromScheme('KikiSwitch', 'sphere', '#80f0ff', { emissive: schemeColor('KikiSwitch', 'sphere', '#00a0ff'), emissiveIntensity: .7, roughness: .24 }),
      switchOffCore: dimmedMaterial('KikiSwitch', 'base', '#39465c', { roughness: .48 }),
      wire: materialFromScheme('KikiWire', 'base', '#2aaad0', { emissive: schemeColor('KikiWire', 'base', '#082530'), emissiveIntensity: .18, roughness: .38 }),
      wireActive: materialFromScheme('KikiWire', 'light', '#80f0ff', { emissive: schemeColor('KikiWire', 'light', '#00c8ff'), emissiveIntensity: .75, roughness: .24 }),
      gear: materialFromScheme('KikiGear', 'base', '#c9c4aa', { metalness: .18, roughness: .36 }),
      generator: materialFromScheme('KikiGenerator', 'base', '#77d68d', { emissive: schemeColor('KikiGenerator', 'base', '#0c3a16'), emissiveIntensity: .32, metalness: .12, roughness: .32 }),
      motor: materialFromScheme('KikiMotorGear', 'base', '#d0a14a', { emissive: schemeColor('KikiMotorGear', 'base', '#4a2a06'), emissiveIntensity: .22, metalness: .16, roughness: .34 }),
      motorCylinder: materialFromScheme('KikiMotorCylinder', 'base', '#d0a14a', { emissive: schemeColor('KikiMotorCylinder', 'base', '#4a2a06'), emissiveIntensity: .22, metalness: .16, roughness: .34 }),
      bomb: materialFromScheme('KikiBomb', 'base', '#2f3038', { emissive: schemeColor('KikiBomb', 'base', '#4a1010'), emissiveIntensity: .3, roughness: .28 }),
      bullet: materialFromScheme('KikiPlayer', 'base', '#ffa35a', { emissive: schemeColor('KikiPlayer', 'base', '#ff5c00'), emissiveIntensity: .9, transparent: true, opacity: .82, roughness: .2 }),
      borderA: materialFromScheme('KikiWorld', 'base', '#777777', { roughness: .55, transparent: true, opacity: .46, side: THREE.DoubleSide }),
      borderB: materialFromScheme('KikiWorld', 'plate', '#8a8a8a', { roughness: .55, transparent: true, opacity: .46, side: THREE.DoubleSide }),
      botBody: materialFromScheme('KikiPlayer', 'base', '#ff8000', { roughness: .42, metalness: .08 }),
      botTire: materialFromScheme('KikiPlayer', 'tire', '#800000', { roughness: .62 }),
      gate: materialFromScheme('KikiGate', 'base', '#ffff00', { emissive: schemeColor('KikiGate', 'base', '#ffff00'), emissiveIntensity: .4, roughness: .35, transparent: true }),
      gateInactive: materialFromScheme('KikiGate', 'base', '#ffff00', { emissive: schemeColor('KikiGate', 'base', '#ffff00'), emissiveIntensity: .08, roughness: .35, transparent: true, opacity: .18 }),
      gateSphere: materialFromScheme('KikiGate', 'sphere', '#ffff00', { emissive: schemeColor('KikiGate', 'sphere', '#ffff00'), emissiveIntensity: .4, roughness: .35, transparent: true }),
      gateInactiveSphere: materialFromScheme('KikiGate', 'sphere', '#ffff00', { emissive: schemeColor('KikiGate', 'sphere', '#ffff00'), emissiveIntensity: .08, roughness: .35, transparent: true, opacity: .18 }),
      mutantBody: materialFromScheme('KikiMutant', 'base', '#800000', { roughness: .46, metalness: .06 }),
      mutantTire: materialFromScheme('KikiMutant', 'tire', '#202020', { roughness: .62 }),
      room: materialFromScheme('KikiWorld', 'base', '#212121', { roughness: .7, transparent: true, opacity: .12, side: THREE.BackSide }),
      roomLine: lineMaterialFromScheme('KikiWorld', 'plate', '#808080', { transparent: true, opacity: .45 })
    };
    function cube(size, material) { return new THREE.Mesh(new THREE.BoxGeometry(size, size, size), material); }
    function box(size, material) { return new THREE.Mesh(new THREE.BoxGeometry(size.x, size.y, size.z), material); }
    function v(position) { return new THREE.Vector3(position.x, position.y, position.z); }
    function centered(level, position, lift) {
      return new THREE.Vector3(
        position.x - level.size.x / 2 + .5,
        (position.y || 0) - level.size.y / 2 + .5 + (lift || 0),
        (position.z || 0) - level.size.z / 2 + .5
      );
    }
    function copyPosition(position) { return { x: position.x, y: position.y || 0, z: position.z || 0 }; }
    function plain(vector) { return { x: vector.x, y: vector.y, z: vector.z }; }
    function add(a, b) { return { x: a.x + b.x, y: (a.y || 0) + (b.y || 0), z: a.z + b.z }; }
    function neg(a) { return { x: -a.x, y: -(a.y || 0), z: -a.z }; }
    function mul(a, scalar) { return { x: a.x * scalar, y: (a.y || 0) * scalar, z: a.z * scalar }; }
    function near(a, b) { return Math.abs(a.x - b.x) < .001 && Math.abs((a.y || 0) - (b.y || 0)) < .001 && Math.abs(a.z - b.z) < .001; }
    function snapshot(source) { return { position: copyPosition(source.position), dir: copyPosition(source.dir), up: copyPosition(source.up) }; }
    function copyTires(tires) { return { left: tires.left, right: tires.right }; }
    function withTires(state, tires) { state.tires = copyTires(tires); return state; }
    function lerpTires(a, b, amount) { return { left: a.left + (b.left - a.left) * amount, right: a.right + (b.right - a.right) * amount }; }
    function quaternionForState(state) {
      const dir = v(state.dir).normalize();
      const up = v(state.up).normalize();
      const right = new THREE.Vector3().crossVectors(up, dir).normalize();
      const matrix = new THREE.Matrix4().makeBasis(right, up, dir);
      return new THREE.Quaternion().setFromRotationMatrix(matrix);
    }
    function stateFromQuaternion(position, quaternion) {
      const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(quaternion).normalize();
      const up = new THREE.Vector3(0, 1, 0).applyQuaternion(quaternion).normalize();
      return { position: copyPosition(position), dir: plain(dir), up: plain(up), quaternion: quaternion.clone() };
    }
    function stateVectors(state) {
      const q = state.quaternion || quaternionForState(state);
      return {
        dir: new THREE.Vector3(0, 0, 1).applyQuaternion(q).normalize(),
        up: new THREE.Vector3(0, 1, 0).applyQuaternion(q).normalize()
      };
    }
    function lerpPosition(a, b, amount) {
      return {
        x: a.x + (b.x - a.x) * amount,
        y: (a.y || 0) + ((b.y || 0) - (a.y || 0)) * amount,
        z: a.z + (b.z - a.z) * amount
      };
    }
    function slerpState(from, to, amount, position) {
      const q = quaternionForState(from).slerp(quaternionForState(to), amount);
      return stateFromQuaternion(position || lerpPosition(from.position, to.position, amount), q);
    }
    function addCube(position, size, material) {
      const mesh = cube(size, material);
      mesh.position.copy(position);
      board.add(mesh);
      return mesh;
    }
    function addBox(position, size, material) {
      const mesh = box(size, material);
      mesh.position.copy(position);
      board.add(mesh);
      return mesh;
    }
    function faceName(face) { return face || 'PZ'; }
    function faceIndex(face) { return ({ PX: 0, PY: 1, PZ: 2, NX: 3, NY: 4, NZ: 5 })[faceName(face)] ?? 2; }
    function faceNormal(face) {
      if (faceName(face) === 'PX') return new THREE.Vector3(-1, 0, 0);
      if (faceName(face) === 'PY') return new THREE.Vector3(0, -1, 0);
      if (faceName(face) === 'PZ') return new THREE.Vector3(0, 0, -1);
      if (faceName(face) === 'NX') return new THREE.Vector3(1, 0, 0);
      if (faceName(face) === 'NY') return new THREE.Vector3(0, 1, 0);
      return new THREE.Vector3(0, 0, 1);
    }
    function applyFaceOrientation(group, face) {
      if (faceName(face) === 'PX') group.rotation.y = Math.PI / 2;
      else if (faceName(face) === 'NX') group.rotation.y = -Math.PI / 2;
      else if (faceName(face) === 'PY') group.rotation.x = -Math.PI / 2;
      else if (faceName(face) === 'NY') group.rotation.x = Math.PI / 2;
      else if (faceName(face) === 'NZ') group.rotation.x = Math.PI;
    }
    function connectionMask(connections) {
      if (connections === undefined || connections === 'all') return 15;
      if (connections === 'vertical') return 5;
      if (connections === 'horizontal') return 10;
      return connections;
    }
    function addWireArm(group, x, y, width, height, material) {
      const arm = new THREE.Mesh(new THREE.BoxGeometry(width, height, .012), material);
      arm.position.set(x, y, .006);
      group.add(arm);
    }
    function gearClockwise(object) {
      const axis = faceIndex(object.face) % 3;
      const p = object.coordinates;
      const sum = (axis === 1 || axis === 2 ? p.x : 0) +
        (axis === 0 || axis === 2 ? (p.y || 0) : 0) +
        (axis === 0 || axis === 1 ? p.z : 0);
      return sum % 2 ? 1 : -1;
    }
    function addRoom(level) {
      const room = new THREE.Mesh(new THREE.BoxGeometry(level.size.x, level.size.y, level.size.z), materials.room);
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(room.geometry), materials.roomLine);
      board.add(room, edges);

          heldInput.jumpGraceUntil = 0;
        } else if (performance.now() <= heldInput.jumpGraceUntil) {
          schedulePlainJump();
        } else {
          heldInput.jumpGraceUntil = 0;
          act('jump');
        }
        return;
      }
      if (map[event.key] && heldInput.move === map[event.key]) {
        event.preventDefault();
        heldInput.move = null;
      }
    });
    addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cameraReady = false; requestDraw(); });
    const spawnFrom = snapshot(game);
    game.applyGravity();
    const spawnTo = snapshot(game);
    visualState = withTires(spawnFrom, tireAngles);
    buildStaticScene();
    updateHud();
    if (!near(spawnFrom.position, spawnTo.position) || !sameOrientation(spawnFrom, spawnTo)) {
      startAnimation(buildSettleAnimation(spawnFrom, spawnTo), spawnTo, 'settle');
    }
    requestDraw();
  </script>
</body>

</html>
