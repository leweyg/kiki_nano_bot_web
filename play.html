function addCube(position, size, material){

}
function addBox(position, size, material){

    }

    for (let y = 0; y < level.size.y; y += 1) {
      addBox(new THREE.Vector3(x - level.size.x / 2 + .5, y - level.size.y / 2 + .5, zmin), new THREE.Vector3(.94, .94, .06), borderMaterial(x, y, 4));

  const group = new THREE.Group();
  const ringA = new THREE.Mesh(new THREE.TorusGeometry(.33, .035, 8, 32), material);
  const ringB = ringA.clone();
  const core = new THREE.Mesh(new THREE.SphereGeometry(.16, 16, 12), material);
  ringB.rotation.x = Math.PI / 2;
  group.add(ringA, ringB, core);

}
const botMesh = KikiMeshes.createBot(THREE, {body: materials.botBody, tire: materials.botTire});
botMesh.matrixAutoUpdate = false;
let visualState = snapshot(game);
let activeAnimation = null;
let queuedAction = null;

const JUMP_GRACE_MS = 220;
function buildStaticScene(){
  while(board.children.length) board.remove(board.children[0]);
  const level = game.level;
  addRoom(level);
  addBoundaryWalls(level);
  for(let z = 0; z < level.size.z; z += 1) {
    for(let x = 0; x < level.size.x; x += 1) {
      addCube(centered(level, {x, y: 0, z}, -.98), .96, (x + z) % 2 ? materials.floorA : materials.floorB);
    }
  }
  (level.walls || []).forEach(wall => addCube(centered(level, wall, 0), .88, materials.wall));
  (level.exits || [{active: true, coordinates: level.exit}]).forEach(exit => {
    if (exit.active === false) return;
    addGate(level, exit);
  });
  board.add(botMesh);
}
function updateBot(level, state){
  const q = state.quaternion || quaternionForState(state);
  const matrix = new THREE.Matrix4().compose(centered(level, state.position, 0), q, new THREE.Vector3(1, 1, 1));
  botMesh.matrix.copy(matrix);
}
function clampInsideRoom(level, position, delta){
  return new THREE.Vector3(
    Math.min(level.size.x / 2 - delta, Math.max(-level.size.x / 2 + delta, position.x)),
    Math.min(level.size.y / 2 - delta, Math.max(-level.size.y / 2 + delta, position.y)),
    Math.min(level.size.z / 2 - delta, Math.max(-level.size.z / 2 + delta, position.z))

function roomRayDistance(level, origin, direction){

  [['x', -level.size.x / 2], ['x', level.size.x / 2], ['y', -level.size.y / 2], ['y', level.size.y / 2], ['z', -level.size.z / 2], ['z', level.size.z / 2]].forEach(([axis, plane]) => {
    const value = direction[axis];

function desiredBehindCamera(level, position, dir, up){

  const maxDistance = botToCamera.length();
  botToCamera.normalize();

  const distance = Math.max(.72, Math.min(maxDistance, wallDistance - .2));

}
function desiredFollowCamera(level, position, dir, up){
  const desiredDistance = 2;
  let botToCamera = camera.position.clone().sub(position);
  if (!cameraReady || botToCamera.length() < .001) {
    return desiredBehindCamera(level, position, dir, up);
  }
  const distance = botToCamera.length();
  if (distance >= desiredDistance) {
    const delta = Math.min(.2, Math.pow(distance - desiredDistance, 2) / 400);
    botToCamera = botToCamera.multiplyScalar(1 - delta);
  } else {
    const delta = Math.min(.2, (desiredDistance - distance) / 20);
    botToCamera = botToCamera.lerp(botToCamera.clone().normalize().multiplyScalar(desiredDistance), delta);
  }
  const side = new THREE.Vector3().crossVectors(dir, up).normalize();

  const behind = dir.clone().multiplyScalar(-1);

function updateCamera(level, state){

  const up = vectors.up;

    camera.position.copy(position).addScaledVector(up, .18);
    camera.lookAt(position.clone().add(dir));

    const desired = cameraMode === 'follow'

function updateHud(){

function animationSegment(kind, duration, from, to, extra){

function actionDuration(name){return game.actionDuration ? game.actionDuration(name) : 200;}

function draw(now){
  if (activeAnimation) {
    visualState = stateAtAnimation(activeAnimation, now);
    if (now - activeAnimation.startedAt >= activeAnimation.totalDuration) finishAnimation();
  }
  updateBot(game.level, visualState);
  updateCamera(game.level, visualState);
  updateHud();
  renderer.render(scene, camera);
  requestAnimationFrame(draw);
}
function act(direction){
  if (activeAnimation) {
    queuedAction = direction;
    return;
  }
  const before = game.clone();
  const from = snapshot(before);
  if (!game.action(direction)) return;
  const to = snapshot(game);
  const segments = buildAnimation(direction, from, to, before);
  activeAnimation = {
    startedAt: performance.now(),
    segments,
    to,
    totalDuration: segments.reduce((total, segment) => total + segment.duration, 0)
  };
  updateHud();
}
function continueHeldInput(){
  const next = heldInput.move;
  if (next && !activeAnimation && !queuedAction) requestAnimationFrame(() => {
    const action = actionForMove(next);
    if (action === 'jump forward') consumeJumpIntent();
    act(action);
  });
}
function setHeldMove(direction, pointerId){
  const changed = heldInput.move !== direction || heldInput.pointerMove !== pointerId;
  heldInput.move = direction;
  heldInput.pointerMove = pointerId;
  if (changed && !activeAnimation && !queuedAction) {
    const action = actionForMove(direction);
    if (action === 'jump forward') consumeJumpIntent();
    act(action);
  }
}
function releaseMove(pointerId){
  if (heldInput.pointerMove === pointerId) {
    heldInput.move = null;
    heldInput.pointerMove = null;
  }
}
const touchpad = document.getElementById('touchpad');
const touchpadKnob = document.getElementById('touchpad-knob');
const touchpadState = {pointerId: null, originX: 0, originY: 0, tapDirection: null, dragging: false};
function directionFromSwipe(dx, dy){
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return null;
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}
function directionFromTouchpadPoint(x, y){
  const rect = touchpad.getBoundingClientRect();
  const dx = x - (rect.left + rect.width / 2);
  const dy = y - (rect.top + rect.height / 2);
  if (Math.max(Math.abs(dx), Math.abs(dy)) < Math.min(rect.width, rect.height) * .32) return null;
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}
function moveTouchpadKnob(dx, dy){
  const limit = 34;
  const scale = Math.min(1, limit / Math.max(limit, Math.hypot(dx, dy)));
  touchpadKnob.style.setProperty('--pad-x', (dx * scale).toFixed(1) + 'px');
  touchpadKnob.style.setProperty('--pad-y', (dy * scale).toFixed(1) + 'px');
}
function resetTouchpad(){
  touchpadState.pointerId = null;
  touchpadState.tapDirection = null;
  touchpadState.dragging = false;
  touchpad.classList.remove('active');
  touchpadKnob.style.setProperty('--pad-x', '0px');
  touchpadKnob.style.setProperty('--pad-y', '0px');
}
touchpad.addEventListener('pointerdown', event => {
  event.preventDefault();
  touchpadState.pointerId = event.pointerId;
  touchpadState.originX = event.clientX;
  touchpadState.originY = event.clientY;
  touchpadState.tapDirection = directionFromTouchpadPoint(event.clientX, event.clientY);
  touchpadState.dragging = false;
  touchpad.setPointerCapture(event.pointerId);
  touchpad.classList.add('active');
});
touchpad.addEventListener('pointermove', event => {
  if (touchpadState.pointerId !== event.pointerId) return;
  event.preventDefault();
  const dx = event.clientX - touchpadState.originX;
  const dy = event.clientY - touchpadState.originY;
  moveTouchpadKnob(dx, dy);
  const direction = directionFromSwipe(dx, dy);
  if (direction) {
    touchpadState.dragging = true;
    setHeldMove(direction, event.pointerId);
  }
});
touchpad.addEventListener('pointerup', event => {
  const tapDirection = touchpadState.pointerId === event.pointerId && !touchpadState.dragging ? touchpadState.tapDirection : null;
  releaseMove(event.pointerId);
  resetTouchpad();
  if (tapDirection) act(tapDirection);
});
touchpad.addEventListener('pointercancel', event => {releaseMove(event.pointerId);resetTouchpad();});
document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => act(button.dataset.action)));
document.getElementById('reset').onclick = () => { location.reload(); };
document.getElementById('push').onclick = () => {};
document.getElementById('shoot').onclick = () => {};
addEventListener('keydown', event => {
  const map = {ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down', ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right'};
  if(event.key === 'v'){event.preventDefault();cameraMode = cameraMode === 'behind' ? 'follow' : cameraMode === 'follow' ? 'inside' : 'behind';updateHud();return;}
  if(event.key === ' '){
    event.preventDefault();
    if (!event.repeat) clearPendingJump();
    heldInput.jump = true;
    heldInput.jumpGraceUntil = performance.now() + JUMP_GRACE_MS;
    if (!event.repeat && heldInput.move === 'up') {
      consumeJumpIntent();
      act('jump forward');
    }
    return;
  }
  if(map[event.key]){
    event.preventDefault();
    heldInput.move = map[event.key];
    if (!event.repeat) {
      const action = actionForMove(heldInput.move);
      if (action === 'jump forward') consumeJumpIntent();
      act(action);
    }
  }
});
addEventListener('keyup', event => {
  const map = {ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down', ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right'};
  if(event.key === ' '){
    event.preventDefault();
    heldInput.jump = false;
    if (heldInput.jumpConsumed) {
      heldInput.jumpConsumed = false;
      heldInput.jumpGraceUntil = 0;
    } else if (performance.now() <= heldInput.jumpGraceUntil) {
      schedulePlainJump();
    } else {
      heldInput.jumpGraceUntil = 0;
      act('jump');
    }
    return;
  }
  if(map[event.key] && heldInput.move === map[event.key]){
    event.preventDefault();
    heldInput.move = null;
  }
});
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cameraReady = false; });
buildStaticScene();
updateHud();
requestAnimationFrame(draw);
