<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiki / level lab</title><style>:root{--ink:#17221f;--paper:#f3f0e8;--green:#25483c;--red:#d96d54}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px monospace}main{max-width:900px;margin:auto;padding:40px 6vw}a{color:var(--green)}h1{font:normal 48px Georgia,serif;color:var(--green)}button{background:var(--red);border:0;color:white;padding:12px 16px;font:inherit}.summary{margin:24px 0;padding:16px;border-top:1px solid #c4c9bc}.row{display:flex;justify-content:space-between;border-bottom:1px solid #d5d8cd;padding:9px 0}.ok{color:#397457}.fail{color:#ae443b}</style></head><body><main><a href="index.html">← back to Kiki</a><h1>Level lab</h1><p>Browser mirror of the offline solver. Every level uses the same state machine as <code>sim.js</code>.</p><button id="run">Run simulation</button><div class="summary" id="summary">Ready.</div><div id="results"></div></main><script src="kiki/js/kiki.js"></script><script>function run(){var results=Kiki.levels.map(function(level){var path=Kiki.solve(level),game=new Kiki.Game(level);(path||[]).forEach(function(action){game.action(action)});var ms=(path||[]).reduce(function(total,action){return total+game.actionDuration(action)},0);return {level:level,path:path,won:game.won,ms:ms}});var good=results.filter(function(r){return r.won}).length;document.getElementById('summary').innerHTML='<strong>'+good+' / '+results.length+' playable</strong>';document.getElementById('results').innerHTML=results.map(function(r){return '<div class="row '+(r.won?'ok':'fail')+'"><span>'+r.level.title+'</span><span>'+(r.won?'PASS · '+r.path.length+' moves · '+r.ms+' ms':'FAIL')+'</span></div>'}).join('')}document.getElementById('run').onclick=run;run();</script></body></html>
